apiVersion: apps/v1
kind: Deployment
metadata:
  name: akr-frontend
  namespace: akr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akr-frontend
  template:
    metadata:
      labels:
        app: akr-frontend
    spec:
      containers:
        - name: web
          image: 5715677660/akr-frontend:hw3
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_BASE_URL
              value: "http://34.203.174.148:31101"
---
apiVersion: v1
kind: Service
metadata:
  name: akr-frontend
  namespace: akr
spec:
  type: NodePort
  selector:
    app: akr-frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      nodePort: 30100
